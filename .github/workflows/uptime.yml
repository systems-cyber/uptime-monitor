name: Uptime check

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub's minimum; runs can start late)
  workflow_dispatch: # lets you run it by hand from the Actions tab
    inputs:
      test_alert:
        description: 'Send a test alert email only (checks no sites)'
        type: boolean
        default: false

permissions:
  contents: write # needed to save state.json back to the repo

concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check sites
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SITES_JSON: ${{ secrets.SITES_JSON }} # optional: overrides sites.json
          FAIL_THRESHOLD: 2 # failed runs in a row before you get a "down" email
          TIMEOUT_MS: 15000 # how long to wait for a site to respond
          TIMEZONE: UTC # time zone used in emails, e.g. Africa/Lagos or Europe/London
          TEST_ALERT: ${{ inputs.test_alert && '1' || '' }}
        run: node check.mjs

      - name: Save state if it changed
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit --quiet -m "Update uptime state"
          git pull --rebase --quiet
          git push --quiet
